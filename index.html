<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Código 12+1 · Haz tu pedido</title>
<meta name="description" content="Salchipapas, perros, hamburguesas y chuzo desgranado. Arma tu pedido y envíalo por WhatsApp.">
<meta property="og:title" content="Código 12+1 · Haz tu pedido">
<meta property="og:description" content="Especialistas en salchipapas. Arma tu pedido aquí y nos llega por WhatsApp.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800;1,900&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --negro:#000000; --fondo:#050403; --panel:#12100B; --panel2:#1A160F; --linea:#3A3122; --linea2:#2A2418;
  --oro:#F9BE24; --oro-claro:#FFDF73; --oro-viejo:#C9A151; --bronce:#89633A; --crema:#EEDC9E; --crema2:#F4E7A1;
  --blanco:#FFFFFF; --texto2:#D3C8AB; --gris:#A2967B; --papel:#FBF4DE; --tinta:#1A140C; --tinta2:#5A4C34;
  --ok:#3DDC84; --mal:#FF6B5E;
  --dorado: linear-gradient(180deg,#FFE58A 0%,#F9BE24 48%,#C9901E 100%);
  --display:'Barlow Condensed', 'Arial Narrow', sans-serif;
  --body:'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--negro)}
body{font-family:var(--body);background:var(--negro);color:var(--blanco);min-height:100vh;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea,select{font:inherit;font-size:16px;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--oro);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.shell{max-width:560px;margin:0 auto;padding-bottom:130px;min-height:100vh;background:var(--fondo)}

/* ---------- Encabezado ---------- */
.hero{position:relative;overflow:hidden;padding:34px 22px 22px;background:radial-gradient(90% 70% at 92% 8%,rgba(249,190,36,.20),transparent 62%),radial-gradient(60% 50% at 0% 100%,rgba(137,99,58,.25),transparent 70%),var(--negro)}
.hero::after{content:"";position:absolute;inset:auto -10% -2px -10%;height:1px;background:linear-gradient(90deg,transparent,rgba(249,190,36,.6),transparent)}
.logo{font-family:var(--display);font-style:italic;font-weight:900;line-height:.8;color:var(--blanco);position:relative;width:max-content}
.logo .l1{display:block;font-size:50px;letter-spacing:.5px;text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 18px rgba(249,190,36,.25)}
.logo .l2{display:block;font-size:118px;letter-spacing:-3px;margin:-4px 0 0 -4px;background:var(--dorado);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #4A3416) drop-shadow(0 0 24px rgba(249,190,36,.28));position:relative}
.logo .l2::after{content:attr(data-t);position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.9) 50%,transparent 65%);background-size:250% 100%;background-position:120% 0;-webkit-background-clip:text;background-clip:text;color:transparent;animation:brillo 1.6s .4s ease-out 1 forwards}
@keyframes brillo{to{background-position:-60% 0}}
.slogan{font-family:var(--display);font-style:italic;font-weight:700;font-size:25px;color:var(--crema);margin-top:14px;letter-spacing:.2px}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:16px;font-size:14px;font-weight:600;color:var(--texto2)}
.estado{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border:1px solid var(--linea);color:var(--blanco);padding:7px 13px 7px 11px;border-radius:99px;font-weight:700}
.estado i{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(61,220,132,.16)}
.estado.off i{background:var(--mal);box-shadow:0 0 0 4px rgba(255,107,94,.16)}
.cuadros{height:16px;background:conic-gradient(#0A0806 25%,var(--crema) 0 50%,#0A0806 0 75%,var(--crema) 0) 0 0/16px 16px;opacity:.9;border-bottom:2px solid var(--oro)}
.aviso{margin:14px 16px 0;border:1.5px solid var(--oro);background:linear-gradient(180deg,rgba(249,190,36,.14),rgba(249,190,36,.04));border-radius:14px;padding:12px 14px;font-weight:700;font-size:15px;color:var(--crema2)}
.cerrado{margin:14px 16px 0;background:var(--panel);border:1.5px solid var(--linea);border-radius:14px;padding:14px 16px;font-size:15px;line-height:1.45;color:var(--texto2)}
.cerrado b{color:var(--oro)}

/* ---------- Categorías ---------- */
.cats{position:sticky;top:0;z-index:20;display:flex;gap:8px;overflow-x:auto;padding:12px 16px;background:rgba(5,4,3,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);scrollbar-width:none;border-bottom:1px solid var(--linea2)}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;padding:8px 15px;border-radius:99px;background:var(--panel);border:1.5px solid var(--linea);font-weight:700;font-size:14.5px;color:var(--texto2);white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
.cats button.on{background:var(--dorado);color:var(--tinta);border-color:var(--oro)}

/* ---------- Menú ---------- */
.sec{padding:26px 16px 2px;scroll-margin-top:64px}
.sec h2{display:inline-block;font-family:var(--display);font-style:italic;font-weight:800;font-size:27px;line-height:1;letter-spacing:.4px;text-transform:uppercase;color:var(--tinta);background:var(--dorado);padding:7px 26px 6px 14px;margin:0 0 -2px 2px;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%);position:relative;z-index:1}
.board{background:linear-gradient(180deg,var(--panel2),var(--panel));border-radius:4px 18px 18px 18px;border:1.5px solid var(--oro-viejo);overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.6),0 18px 40px -24px rgba(249,190,36,.35)}
.item{display:flex;align-items:center;gap:14px;padding:15px 16px;cursor:pointer;position:relative}
.item + .item{border-top:1px dashed var(--linea)}
.item:active{background:rgba(249,190,36,.06)}
.item-txt{flex:1;min-width:0}
.item h3{font-size:17px;font-weight:800;line-height:1.2;color:var(--blanco)}
.item p{font-size:14px;color:var(--gris);line-height:1.4;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item-price{margin-top:7px;font-weight:800;font-size:17px;color:var(--crema2)}
.vchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.vchip{font-size:13.5px;font-weight:600;color:var(--texto2);border:1px solid var(--linea);background:rgba(255,255,255,.03);border-radius:99px;padding:5px 11px;text-align:left}
.vchip b{color:var(--crema2);font-weight:800;margin-left:2px}
.vchip:active{border-color:var(--oro)}
.vchip:disabled{opacity:.5}
.item-price small{font-weight:600;color:var(--gris);font-size:13px}
.agotado{display:inline-block;margin-left:8px;font-size:12px;font-weight:800;color:var(--mal);border:1px solid rgba(255,107,94,.4);padding:1px 8px;border-radius:6px}
.item.off{cursor:default}
.item.off h3,.item.off .item-price{color:var(--gris)}
.item.off .ph img{filter:grayscale(1);opacity:.5}
.ph{width:104px;height:104px;flex:none;border-radius:14px;overflow:hidden;position:relative;background:var(--panel2);border:1px solid var(--linea)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.plus{width:38px;height:38px;flex:none;border-radius:50%;background:var(--dorado);color:var(--tinta);display:grid;place-items:center;font-size:25px;font-weight:800;line-height:1;position:relative;box-shadow:0 0 0 1px var(--bronce),0 4px 14px -4px rgba(249,190,36,.6)}
.ph .plus{position:absolute;right:6px;bottom:6px;width:34px;height:34px;font-size:22px}
.qty{position:absolute;top:-7px;right:-7px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--negro);color:var(--oro);font-size:12px;font-weight:800;display:grid;place-items:center;border:1.5px solid var(--oro)}
.ph .qty{top:6px;right:6px}
.foot{padding:34px 22px 10px;color:var(--gris);font-size:14px;line-height:1.6}
.foot b{color:var(--crema)}
.skel{height:86px;border-radius:14px;background:linear-gradient(90deg,#15120C 0%,#241E14 50%,#15120C 100%);background-size:200% 100%;animation:sk 1.2s infinite;margin:0 0 10px}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- Barra del pedido ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 14px calc(12px + env(safe-area-inset-bottom));pointer-events:none}
.barbtn{pointer-events:auto;max-width:532px;margin:0 auto;width:100%;display:flex;align-items:center;gap:12px;background:var(--dorado);color:var(--tinta);border-radius:18px;padding:13px 16px;box-shadow:0 0 0 1.5px var(--bronce),0 14px 34px -10px rgba(249,190,36,.55);font-weight:800;font-size:16.5px}
.barbtn .cnt{background:var(--negro);color:var(--oro);min-width:30px;height:30px;padding:0 8px;border-radius:10px;display:grid;place-items:center;font-weight:800}
.barbtn .tot{margin-left:auto;font-weight:800}
.barbtn.bump{animation:bump .35s ease}
@keyframes bump{40%{transform:scale(1.04)}}

/* ---------- Hoja de producto ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:40;animation:fade .2s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:var(--panel);border:1.5px solid var(--oro-viejo);border-bottom:0;border-radius:24px 24px 0 0;max-height:92vh;display:flex;flex-direction:column;animation:up .3s cubic-bezier(.2,.9,.3,1)}
.sheet .x{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.7);color:var(--blanco);border:1px solid var(--linea);font-size:24px;line-height:1;z-index:2}
.sheet-scroll{overflow-y:auto;flex:1;overscroll-behavior:contain}
.sheet-img{width:100%;height:230px;object-fit:cover;display:block;border-radius:22px 22px 0 0}
.sheet-body{padding:22px 18px 10px}
.sheet h2{font-family:var(--display);font-style:italic;font-weight:800;font-size:34px;line-height:1;padding-right:40px;color:var(--blanco);text-transform:uppercase}
.sheet-desc{color:var(--texto2);font-size:15px;line-height:1.45;margin-top:8px}
.sheet h4{font-size:15px;font-weight:800;margin:20px 0 9px;color:var(--crema)}
.vars{display:grid;gap:8px}
.var{display:flex;align-items:center;gap:12px;padding:14px;border:1.5px solid var(--linea);border-radius:14px;text-align:left;font-weight:700;font-size:16px;background:var(--panel2)}
.var .var-n{flex:1}
.var b{color:var(--crema2)}
.var.on{border-color:var(--oro);box-shadow:inset 0 0 0 1px var(--oro);background:rgba(249,190,36,.08)}
.radio{width:21px;height:21px;border-radius:50%;border:2px solid var(--linea);flex:none;display:grid;place-items:center}
.on > .radio{border-color:var(--oro)}
.on > .radio::after{content:"";width:11px;height:11px;border-radius:50%;background:var(--oro)}
.sheet textarea,.f input,.f textarea,.f select{width:100%;padding:13px 14px;border:1.5px solid var(--linea);border-radius:13px;background:#0B0907;color:var(--blanco);outline:none;transition:border-color .15s,box-shadow .15s;resize:vertical}
.sheet textarea::placeholder,.f input::placeholder,.f textarea::placeholder{color:#7A705C}
.sheet textarea:focus,.f input:focus,.f textarea:focus{border-color:var(--oro);box-shadow:0 0 0 3px rgba(249,190,36,.25)}
.sheet-foot{display:flex;gap:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--linea)}
.step{display:flex;align-items:center;border:1.5px solid var(--linea);border-radius:14px;flex:none;background:var(--panel2)}
.step button{width:44px;height:50px;font-size:24px;font-weight:700;color:var(--crema)}
.step span{min-width:26px;text-align:center;font-weight:800;font-size:17px}
.cta{flex:1;display:flex;justify-content:space-between;align-items:center;background:var(--dorado);color:var(--tinta);border-radius:14px;font-weight:800;font-size:16.5px;padding:0 18px;height:52px;box-shadow:0 0 0 1px var(--bronce)}
.cta:active{filter:brightness(.92)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}}

/* ---------- Pedido ---------- */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 14px;background:rgba(0,0,0,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:2px solid var(--oro)}
.back{display:inline-flex;align-items:center;gap:4px;font-weight:700;padding:8px 12px 8px 6px;border-radius:12px;background:var(--panel2);border:1px solid var(--linea);color:var(--crema)}
.back svg{width:20px;height:20px}
.topbar h1{font-family:var(--display);font-style:italic;font-weight:800;font-size:26px;margin-left:auto;text-transform:uppercase;background:var(--dorado);-webkit-background-clip:text;background-clip:text;color:transparent}
.wrap{padding:20px 16px}
.ticket-w{filter:drop-shadow(0 10px 22px rgba(249,190,36,.18))}
.ticket{--s:7px;background:var(--papel);color:var(--tinta);padding:22px 18px 24px;
  -webkit-mask:radial-gradient(var(--s) at 50% 0,#0000 98%,#000) 50% 0/calc(2.4*var(--s)) 51% repeat-x,radial-gradient(var(--s) at 50% 100%,#0000 98%,#000) 50% 100%/calc(2.4*var(--s)) 51% repeat-x;
  mask:radial-gradient(var(--s) at 50% 0,#0000 98%,#000) 50% 0/calc(2.4*var(--s)) 51% repeat-x,radial-gradient(var(--s) at 50% 100%,#0000 98%,#000) 50% 100%/calc(2.4*var(--s)) 51% repeat-x}
.t-head{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:12px;border-bottom:2px dashed var(--tinta)}
.t-head b{font-family:var(--display);font-style:italic;font-weight:900;font-size:24px}
.t-head span{font-size:13px;color:var(--tinta2);font-weight:600}
.t-item{display:flex;gap:12px;padding:13px 0;border-bottom:1.5px dashed #D9CCA5}
.t-main{flex:1;min-width:0}
.t-name{font-weight:700;font-size:15.5px;line-height:1.3}
.t-name span{color:var(--tinta2);font-weight:600}
.t-note{color:var(--tinta2);font-size:13.5px;margin-top:3px}
.t-right{display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.t-price{font-weight:800}
.mini{display:flex;align-items:center;border:1.5px solid #D9CCA5;border-radius:10px;background:#FFFDF4}
.mini button{width:32px;height:30px;font-weight:800;font-size:17px;color:var(--tinta)}
.mini span{min-width:18px;text-align:center;font-weight:800;font-size:14px}
.t-sum{padding-top:12px}
.t-row{display:flex;justify-content:space-between;padding:3px 0;font-size:15px;color:var(--tinta2)}
.t-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding-top:12px;border-top:2px dashed var(--tinta);font-weight:800;font-size:21px}
.t-total small{font-size:13px;color:var(--tinta2);font-weight:600}

.fsec{margin-top:28px}
.fsec h3{font-family:var(--display);font-style:italic;font-weight:800;font-size:24px;margin:0 2px 12px;text-transform:uppercase;color:var(--oro);letter-spacing:.3px}
.f{display:block;margin-bottom:11px}
.f > span{display:block;font-size:14px;font-weight:700;color:var(--texto2);margin-bottom:6px}
.f textarea{min-height:78px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border:1.5px solid var(--linea);border-radius:15px;padding:4px;margin-bottom:12px}
.seg button{padding:12px;border-radius:11px;font-weight:800;font-size:15.5px;color:var(--texto2)}
.seg button.on{background:var(--dorado);color:var(--tinta)}
.geo{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border:1.5px dashed var(--oro-viejo);border-radius:13px;font-weight:700;font-size:15px;color:var(--crema)}
.geo svg{width:19px;height:19px}
.geo.ok{border-style:solid;border-color:var(--ok);color:var(--ok);background:rgba(61,220,132,.08)}
.pays{display:grid;gap:8px}
.pay{display:flex;align-items:center;gap:12px;text-align:left;padding:14px;border:1.5px solid var(--linea);border-radius:14px;background:var(--panel)}
.pay.on{border-color:var(--oro);box-shadow:inset 0 0 0 1px var(--oro);background:rgba(249,190,36,.07)}
.pay b{display:block;font-weight:700;font-size:16px}
.pay small{display:block;color:var(--gris);font-size:14px;margin-top:2px}
.hint{font-size:14px;color:var(--gris);margin:8px 2px 0;line-height:1.45}
.err{background:rgba(255,107,94,.10);border:1.5px solid rgba(255,107,94,.45);color:#FFC2BA;border-radius:14px;padding:12px 14px;font-size:15px;font-weight:600;margin-top:18px;line-height:1.45}
.err:empty{display:none}
.err ul{padding-left:18px}
.send{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:20px;background:var(--dorado);color:var(--tinta);border-radius:17px;padding:18px;font-weight:800;font-size:18px;text-decoration:none;box-shadow:0 0 0 1.5px var(--bronce),0 14px 30px -12px rgba(249,190,36,.7)}
.send:active{filter:brightness(.92)}
.send:disabled{opacity:.6}
.send svg{width:22px;height:22px}
.fine{text-align:center;font-size:14px;color:var(--gris);margin-top:12px;line-height:1.4}
.fine b{color:var(--crema)}
.empty-cart{text-align:center;padding:60px 20px}
.empty-cart .logo{margin:0 auto}
.empty-cart p{color:var(--gris);margin:10px 0 20px;font-size:16px}
.btn-dark{display:inline-flex;align-items:center;justify-content:center;background:var(--dorado);color:var(--tinta);border-radius:14px;padding:14px 22px;font-weight:800;text-decoration:none}

/* ---------- Pedido enviado ---------- */
.done{padding:48px 20px 20px;text-align:center}
.okmark{width:88px;height:88px;margin:0 auto 18px;border-radius:50%;background:var(--dorado);color:var(--tinta);display:grid;place-items:center;box-shadow:0 0 0 6px rgba(249,190,36,.15),0 0 40px rgba(249,190,36,.35);animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.okmark svg{width:44px;height:44px}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.done h1{font-family:var(--display);font-style:italic;font-weight:900;font-size:40px;line-height:1;text-transform:uppercase;color:var(--blanco)}
.done > p{font-size:16.5px;line-height:1.5;margin:12px auto 0;max-width:32ch;color:var(--texto2)}
.done > p b{color:var(--oro);white-space:nowrap}
.done .ticket-w{margin:26px auto 0;max-width:300px}
.done .ticket{text-align:center;padding:24px 18px}
.done .num{font-family:var(--display);font-style:italic;font-weight:900;font-size:44px;margin:4px 0}
.done .ticket span{color:var(--tinta2);font-size:14px;font-weight:600}
.done .send{max-width:360px;margin:26px auto 0}
.linkbtn{display:block;margin:16px auto 0;font-weight:700;text-decoration:underline;text-underline-offset:3px;font-size:15.5px;color:var(--crema)}

.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-160%);opacity:0;visibility:hidden;z-index:90;background:var(--crema);color:var(--tinta);padding:12px 18px;border-radius:14px;font-weight:800;font-size:15px;box-shadow:0 10px 30px -10px rgba(0,0,0,.8);max-width:calc(100% - 28px);text-align:center;transition:transform .25s ease,opacity .25s ease,visibility .25s}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}
</style>
</head>
<body>
<div id="main"></div>
<div id="bar" class="bar"></div>
<div id="sheet"></div>
<div id="modal"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module">
/* =====================================================================
   CÓDIGO 12+1 · CONFIGURACIÓN
   Esta misma configuración está en las dos páginas:
     index.html  → la página de pedidos que le mandas a los clientes
     panel.html  → tu panel (pedidos, ventas, inventario, reportes)

   1) CONFIGURACIÓN DE FIREBASE
   Pega aquí la configuración de tu proyecto (Firebase > Configuración
   del proyecto > Tus apps > App web). Si la dejas vacía, la página de
   pedidos funciona igual pero solo envía a WhatsApp (sin panel).
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDhhxP8ehmys_rtPHBjB17k4jBEKrGa6LQ",

let spy;
function setupSpy(){
  spy?.disconnect();
  const nav = $('#cats'); if (!nav) return;
  const chips = [...nav.querySelectorAll('button')];
  const mark = id => { chips.forEach(ch => ch.classList.toggle('on', ch.dataset.cat === id)); const on = chips.find(ch => ch.dataset.cat === id); if (on) nav.scrollTo({left: on.offsetLeft - nav.clientWidth / 2 + on.clientWidth / 2, behavior: 'smooth'}); };
  spy = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) mark(en.target.id.slice(4)); }), {rootMargin: '-90px 0px -70% 0px'});
  $$('.sec').forEach(s => spy.observe(s));
  if (chips[0]) chips[0].classList.add('on');
}

        ${cfg.recoger ? `<div class="seg" role="radiogroup"><button class="${t.isDom ? 'on' : ''}" data-act="entrega" data-v="domicilio" role="radio" aria-checked="${t.isDom}">Domicilio</button><button class="${!t.isDom ? 'on' : ''}" data-act="entrega" data-v="recoger" role="radio" aria-checked="${!t.isDom}">Lo recojo</button></div>` : ''}
        ${t.isDom ? `
          <label class="f"><span>Dirección</span><input data-k="dir" autocomplete="street-address" maxlength="120" value="${esc(c.dir)}" placeholder="Ej: Cra 46 # 72-15, apto 302"></label>
          <div class="two">
            <label class="f"><span>Barrio</span><input data-k="barrio" maxlength="60" value="${esc(c.barrio)}"></label>
            <label class="f"><span>Referencia</span><input data-k="ref" maxlength="80" value="${esc(c.ref)}" placeholder="Opcional"></label>
          </div>
          <button class="geo ${c.ubic ? 'ok' : ''}" data-act="geo">${ICON.pin}${c.ubic ? 'Ubicación agregada' : 'Enviar mi ubicación (opcional)'}</button>`
        : `<p class="hint">Te escribimos por WhatsApp cuando tu pedido esté listo para recoger.</p>`}
      </section>

      <section class="fsec"><h3>Pago</h3>
        <div class="pays" role="radiogroup">${pays.map(p => `<button class="pay ${c.pago === p.id ? 'on' : ''}" data-act="pago" data-v="${p.id}" role="radio" aria-checked="${c.pago === p.id}"><span class="radio"></span><span><b>${esc(p.label)}</b>${p.info ? `<small>${esc(p.info)}</small>` : ''}</span></button>`).join('')}</div>
        ${c.pago === 'efectivo' ? `<label class="f" style="margin-top:12px"><span>¿Con cuánto vas a pagar?</span><input class="money" data-k="pagaCon" inputmode="numeric" value="${esc(c.pagaCon)}" placeholder="Ej: 50.000 (para llevarte el cambio)"></label>` : ''}
        ${c.pago && c.pago !== 'efectivo' ? `<p class="hint">Cuando envíes el pedido, mándanos el comprobante por el mismo chat.</p>` : ''}
      </section>

      <section class="fsec"><h3>Comentarios</h3>
        <label class="f"><textarea data-k="obs" maxlength="300" placeholder="Algo más que debamos saber (opcional)" aria-label="Comentarios">${esc(c.obs)}</textarea></label>
      </section>

      <div id="err" class="err" role="alert"></div>
      <button class="send" id="sendBtn" data-act="send">${ICON.check}Hacer pedido</button>
      <p class="fine">Te confirmamos por WhatsApp al celular que escribiste.</p>
    </div>
  </div>`;
}
function validate(){
  const c = S.cli, t = totals(), e = [];
  if (!S.cart.length) e.push('Tu pedido está vacío.');
  if (!S.cfg.abierto) e.push(`En este momento no estamos recibiendo pedidos.${S.cfg.horario ? ' Horario: ' + S.cfg.horario.replace(/\.?$/, '.') : ''}`);
  if (c.nombre.trim().length < 2) e.push('Escribe tu nombre.');
  if (telLocal(c.tel).length !== 10) e.push('Escribe tu celular de 10 dígitos.');
  if (t.isDom){
    if (c.dir.trim().length < 5) e.push('Escribe la dirección de entrega.');
    if (c.barrio.trim().length < 2) e.push('Escribe el barrio.');
  }
  if (!c.pago) e.push('Elige cómo vas a pagar.');
  if (+S.cfg.pedidoMinimo && t.sub < +S.cfg.pedidoMinimo) e.push(`El pedido mínimo es de ${fmt(S.cfg.pedidoMinimo)}. Te faltan ${fmt(S.cfg.pedidoMinimo - t.sub)}.`);
  if (c.pago === 'efectivo' && c.pagaCon && parseMoney(c.pagaCon) < t.total) e.push(`El billete con el que pagas (${fmt(parseMoney(c.pagaCon))}) es menor que el total.`);
  return e;
}
function genNum(){ const d = new Date(), p = n => String(n).padStart(2, '0'); return `${p(d.getMonth() + 1)}${p(d.getDate())}-${Math.floor(100 + Math.random() * 900)}`; }
function buildOrder(){
  const c = S.cli, t = totals(), pago = payOptions().find(p => p.id === c.pago);
  return {
    num: genNum(),
    items: S.cart.map(i => ({id: i.id || '', nombre: i.nombre, variante: i.variante || '', precio: +i.precio, cant: +i.cant, nota: i.nota || ''})),
    subtotal: t.sub, domicilio: t.dom, domPendiente: t.domPend, total: t.total,
    entrega: t.isDom ? 'domicilio' : 'recoger',
    cliente: {nombre: c.nombre.trim(), tel: telLocal(c.tel), dir: t.isDom ? c.dir.trim() : '', barrio: t.isDom ? c.barrio.trim() : '', ref: t.isDom ? c.ref.trim() : '', ubic: t.isDom ? c.ubic : ''},
    pago: c.pago, pagoLabel: pago ? pago.label : c.pago,
    pagaCon: c.pago === 'efectivo' ? parseMoney(c.pagaCon) : 0,
    obs: c.obs.trim(), estado: 'nuevo', creado: Date.now()
  };
}
function buildMsg(o){
  const c = o.cliente, L = [];
  L.push(`*NUEVO PEDIDO · ${S.cfg.nombre.toUpperCase()}*`);
  L.push(`Pedido *#${o.num}*`, '');
  L.push(`👤 *Cliente:* ${c.nombre}`);
  L.push(`📱 *Celular:* ${prettyTel(c.tel)}`);
  if (o.entrega === 'domicilio'){
    L.push(`🛵 *Entrega:* Domicilio`);
    L.push(`📍 *Dirección:* ${c.dir}`);
    L.push(`🏠 *Barrio:* ${c.barrio}`);
    if (c.ref) L.push(`🔎 *Referencia:* ${c.ref}`);
    if (c.ubic) L.push(`🗺️ *Ubicación:* ${c.ubic}`);
  } else L.push(`🏃 *Entrega:* Lo recoge el cliente`);
  L.push('', '🧾 *DETALLE*');
  o.items.forEach(i => {
    L.push(`• ${i.cant} x ${i.nombre}${i.variante ? ` (${i.variante})` : ''}: ${fmt(i.precio * i.cant)}`);
    if (i.nota) L.push(`   ↳ ${i.nota}`);
  });
  L.push('', `Subtotal: ${fmt(o.subtotal)}`);
  if (o.entrega === 'domicilio') L.push(`Domicilio: ${o.domicilio ? fmt(o.domicilio) : 'por confirmar'}`);
  L.push(`*TOTAL: ${fmt(o.total)}${o.domPendiente ? ' + domicilio' : ''}*`, '');
  let pago = `💳 *Pago:* ${o.pagoLabel}`;
  if (o.pagaCon) pago += o.domPendiente ? ` (paga con ${fmt(o.pagaCon)})` : ` (paga con ${fmt(o.pagaCon)}, cambio ${fmt(o.pagaCon - o.total)})`;
  L.push(pago);
  if (o.obs) L.push(`📝 *Comentarios:* ${o.obs}`);
  return L.join('\n');
}
async function enviar(){
  const errEl = $('#err'), btn = $('#sendBtn');
  const e = validate();
  if (e.length){ errEl.innerHTML = e.length === 1 ? esc(e[0]) : `<ul>${e.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`; errEl.scrollIntoView({behavior: 'smooth', block: 'center'}); return; }
  errEl.innerHTML = '';
  const order = buildOrder();
  const url = `https://api.whatsapp.com/send?phone=${waNum(S.cfg.whatsapp)}&text=${encodeURIComponent(buildMsg(order))}`;
  btn.disabled = true; btn.innerHTML = 'Enviando tu pedido…';
  let guardado = false;
  if (FB_ON){
    try {
      await withTimeout((async () => {
        if (S.fbReady) await S.fbReady;
        const {collection, addDoc, serverTimestamp} = fb.fs;
        await addDoc(collection(fb.db, 'pedidos'), {...order, fecha: serverTimestamp()});
      })(), 8000);
      guardado = true;
    } catch (err){ console.warn('No se guardó en la nube:', err); }
  }
  if (guardado) avisarDueno(order);
  S.last = {num: order.num, total: order.total, domPend: order.domPendiente, url, tel: order.cliente.tel, modo: guardado ? 'ok' : 'wa', t: Date.now()};
  try { sessionStorage.setItem('c121_last', JSON.stringify(S.last)); } catch (x){}
  S.cart = []; saveCart(); S.cli.obs = ''; S.cli.pagaCon = ''; S.cli.ubic = '';
  S.view = 'done'; render(); window.scrollTo(0, 0);
  if (!guardado) setTimeout(() => { location.href = url; }, 600);
}
// Aviso automático al WhatsApp del negocio (CallMeBot, gratis). Se activa poniendo la clave en Ajustes del panel.
function avisarDueno(order){
  const key = String(S.cfg.cmbKey || '').trim(); if (!key) return;
  const panel = new URL('panel.html', location.href).href;
  const texto = buildMsg(order) + `\n\nVer en el panel: ${panel}`;
  const url = `https://api.callmebot.com/whatsapp.php?phone=%2B${waNum(S.cfg.whatsapp)}&apikey=${encodeURIComponent(key)}&text=${encodeURIComponent(texto)}`;
  try { fetch(url, {mode: 'no-cors', keepalive: true}).catch(() => {}); } catch (x){}
}
function renderDone(){
  const l = S.last || {};
  const ok = l.modo !== 'wa';
  main.innerHTML = `<div class="shell"><div class="done">
    <div class="okmark">${ICON.check}</div>
    <h1>${ok ? '¡Pedido recibido!' : 'Envíanos tu pedido'}</h1>
    ${ok
      ? `<p>Ya nos llegó tu pedido. En unos minutos te escribimos por WhatsApp${l.tel ? ` al <b>${esc(prettyTel(l.tel))}</b>` : ''} para confirmarlo.</p>`
      : '<p>No pudimos registrar el pedido desde la página. Te abrimos WhatsApp con el pedido escrito: toca <b>Enviar</b> para que nos llegue.</p>'}
    <div class="ticket-w"><div class="ticket"><span>Pedido</span><div class="num">#${esc(l.num)}</div><span>Total ${fmt(l.total)}${l.domPend ? ' + domicilio' : ''}</span></div></div>
    ${ok ? '<button class="send" data-act="toMenu">Hacer otro pedido</button>' : `<a class="send" href="${esc(l.url)}">${ICON.chat}Abrir WhatsApp</a><button class="linkbtn" data-act="toMenu">Hacer otro pedido</button>`}
  </div></div>`;
}
function pedirUbicacion(){
  if (!navigator.geolocation){ toast('Tu teléfono no permite compartir la ubicación desde aquí'); return; }
  const b = $('[data-act="geo"]'); if (b) b.innerHTML = ICON.pin + 'Buscando tu ubicación…';
  navigator.geolocation.getCurrentPosition(pos => {
    const {latitude: la, longitude: lo} = pos.coords;
    S.cli.ubic = `https://maps.google.com/?q=${la.toFixed(6)},${lo.toFixed(6)}`;
    renderCart();
  }, () => { toast('No pudimos obtener tu ubicación. Escribe bien la dirección y el barrio.'); renderCart(); }, {enableHighAccuracy: true, timeout: 12000, maximumAge: 60000});
}

async function clientBoot(){
  const cache = LS.get('c121_cache', null);
  if (cache?.menu?.length){ S.cfg = {...DEFAULT_CONFIG, ...cache.cfg}; S.menu = normMenu(cache.menu); }
  else if (FB_ON) S.loading = true;
  try {
    const nav = performance.getEntriesByType('navigation')[0]?.type;
    const l = JSON.parse(sessionStorage.getItem('c121_last') || 'null');
    if (l && Date.now() - l.t < 15 * 60000 && (nav === 'back_forward' || nav === 'reload')){ S.last = l; S.view = 'done'; }
  } catch (x){}
  render();
  if (!FB_ON) return;
  const stopLoading = () => { if (S.loading){ S.loading = false; if (S.view === 'menu') renderMenu(); } };
  const fallback = setTimeout(stopLoading, 7000);
  S.fbReady = initFirebase(false);
  try{
    await S.fbReady;
    const {doc, collection, onSnapshot} = fb.fs;
    let gotCfg = false, gotMenu = false;
    const done = () => {
      if (!(gotCfg && gotMenu)) return;
      clearTimeout(fallback); S.loading = false;
      LS.set('c121_cache', {cfg: S.cfg, menu: S.menu});
      if (S.view === 'menu'){ const y = scrollY; renderMenu(); window.scrollTo(0, y); renderBar(); }
      else if (S.view === 'cart'){ const y = scrollY; renderCart(); window.scrollTo(0, y); }
    };
    onSnapshot(doc(fb.db, 'config', 'negocio'), d => { S.cfg = {...DEFAULT_CONFIG, ...(d.exists() ? d.data() : {})}; gotCfg = true; done(); }, () => { gotCfg = true; done(); });
    onSnapshot(collection(fb.db, 'productos'), snap => {
      S.menu = snap.empty ? normMenu(DEFAULT_MENU) : normMenu(snap.docs.map(d => ({id: d.id, ...d.data()})));
      gotMenu = true; done();
    }, () => { gotMenu = true; done(); });
  }catch(err){ console.warn('Firebase no disponible', err); stopLoading(); }
}

/* =====================================================================
   EVENTOS
   ===================================================================== */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  switch (act){
    // cliente
    case 'open': openSheet(id, +(el.dataset.vi || 0)); break;
    case 'closeSheet': closeSheet(); break;
    case 'var': S.sheet.vi = +el.dataset.i; sheetUpdate(); break;
    case 'sinc': S.sheet.cant = Math.min(50, S.sheet.cant + 1); sheetUpdate(); break;
    case 'sdec': S.sheet.cant = Math.max(1, S.sheet.cant - 1); sheetUpdate(); break;
    case 'addCart': addCart(); break;
    case 'goCat': { const s = $('#sec-' + el.dataset.cat); if (s) window.scrollTo({top: s.getBoundingClientRect().top + scrollY - ($('#cats')?.offsetHeight || 0) + 6, behavior: 'smooth'}); break; }
    case 'toCart': S.menuY = scrollY; S.view = 'cart'; render(); window.scrollTo(0, 0); break;
    case 'toMenu': S.view = 'menu'; render(); window.scrollTo(0, S.last ? 0 : S.menuY); S.last = null; try { sessionStorage.removeItem('c121_last'); } catch (x){} break;
    case 'cinc': case 'cdec': {
      const it = S.cart[+el.dataset.i]; if (!it) break;
      it.cant += act === 'cinc' ? 1 : -1; if (it.cant <= 0) S.cart.splice(+el.dataset.i, 1);
      saveCart(); const y = scrollY; renderCart(); window.scrollTo(0, y); break;
    }
    case 'entrega': S.cli.entrega = el.dataset.v; saveCli(); { const y = scrollY; renderCart(); window.scrollTo(0, y); } break;
    case 'pago': S.cli.pago = el.dataset.v; saveCli(); { const y = scrollY; renderCart(); window.scrollTo(0, y); } break;
    case 'geo': pedirUbicacion(); break;
    case 'send': enviar(); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.sheet) closeSheet();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.item[data-act="open"]')){ e.preventDefault(); openSheet(e.target.dataset.id); }
});
document.addEventListener('input', e => { const k = e.target.dataset?.k; if (k){ S.cli[k] = e.target.value; saveCli(); } });
document.addEventListener('focusout', e => {
  const t = e.target;
  if (t.classList?.contains('money')){ const n = parseMoney(t.value); t.value = n ? NF.format(n) : ''; if (t.dataset.k) S.cli[t.dataset.k] = t.value; }
});

// Si alguien entra con el link viejo (?admin) lo mandamos al panel
if (new URLSearchParams(location.search).has('admin') || location.hash === '#admin') location.replace('panel.html');
else clientBoot();
</script>
