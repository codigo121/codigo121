<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel · Código 12+1</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Panel 12+1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800;1,900&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --mostaza:#FFC21A; --tomate:#D42A1F; --tomate2:#B32117; --rosada:#FCE8E3; --rosada2:#F6D3CB;
  --carbon:#2A1B14; --carbon2:#4A372D; --gris:#85695D; --linea:#EFCFC6; --blanco:#FFFFFF;
  --verde:#1F9D55; --verde2:#178245;
  --display:'Bungee', 'Arial Black', sans-serif;
  --body:'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:auto}
body{font-family:var(--body);background:var(--rosada);color:var(--carbon);min-height:100vh;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea,select{font:inherit;font-size:16px;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--carbon);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.shell{max-width:560px;margin:0 auto;padding-bottom:130px;min-height:100vh}

/* ---------- Encabezado ---------- */
.hero{background:var(--mostaza);padding:30px 22px 18px;position:relative}
.logo{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;letter-spacing:.3px;color:var(--carbon);line-height:.86;text-shadow:3px 3px 0 var(--tomate)}
.logo .l1{display:block;font-size:30px;letter-spacing:1px}
.logo .l2{display:block;font-size:92px;letter-spacing:-2px;margin-left:-4px;text-shadow:5px 5px 0 var(--tomate)}
.slogan{font-size:19px;font-weight:700;margin-top:14px;max-width:24ch;line-height:1.25}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:16px;font-size:14px;font-weight:600;color:var(--carbon2)}
.estado{display:inline-flex;align-items:center;gap:8px;background:var(--carbon);color:var(--blanco);padding:7px 12px 7px 10px;border-radius:99px;font-weight:700}
.estado i{width:9px;height:9px;border-radius:50%;background:#45D483}
.estado.off i{background:#FF6B5E}
.drip{display:block;width:100%;height:26px;margin-top:-1px}
.aviso{margin:4px 16px 0;background:var(--blanco);border:2px solid var(--carbon);border-radius:14px;padding:12px 14px;font-weight:600;font-size:15px}
.cerrado{margin:4px 16px 0;background:var(--carbon);color:var(--blanco);border-radius:14px;padding:14px 16px;font-size:15px;line-height:1.4}
.cerrado b{color:var(--mostaza)}

/* ---------- Categorías ---------- */
.cats{position:sticky;top:0;z-index:20;display:flex;gap:8px;overflow-x:auto;padding:12px 16px;background:rgba(252,232,227,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;padding:9px 15px;border-radius:99px;background:var(--blanco);border:1.5px solid var(--linea);font-weight:700;font-size:14.5px;white-space:nowrap;transition:background .15s,color .15s}
.cats button.on{background:var(--carbon);color:var(--mostaza);border-color:var(--carbon)}

/* ---------- Menú ---------- */
.sec{padding:20px 16px 2px;scroll-margin-top:66px}
.sec h2{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;letter-spacing:.3px;font-size:25px;line-height:1.05;margin:0 4px 12px;color:var(--carbon)}
.board{background:var(--blanco);border-radius:20px;border:1.5px solid var(--linea);overflow:hidden}
.item{display:flex;align-items:center;gap:14px;padding:16px;cursor:pointer;position:relative}
.item + .item{border-top:1.5px dashed var(--linea)}
.item:active{background:#FFFCF4}
.item-txt{flex:1;min-width:0}
.item h3{font-size:17px;font-weight:800;line-height:1.2}
.item p{font-size:14px;color:var(--gris);line-height:1.4;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item-price{margin-top:8px;font-weight:800;font-size:16px}
.item-price small{font-weight:600;color:var(--gris);font-size:13px}
.agotado{display:inline-block;margin-left:8px;font-size:12px;font-weight:800;color:var(--tomate);background:var(--rosada);padding:2px 8px;border-radius:6px}
.item.off{cursor:default}
.item.off h3,.item.off .item-price{color:var(--gris)}
.item.off .ph img{filter:grayscale(1);opacity:.6}
.ph{width:104px;height:104px;flex:none;border-radius:14px;overflow:hidden;position:relative;background:var(--rosada)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.plus{width:38px;height:38px;flex:none;border-radius:50%;background:var(--tomate);color:var(--blanco);display:grid;place-items:center;font-size:24px;font-weight:700;line-height:1;position:relative}
.ph .plus{position:absolute;right:6px;bottom:6px;width:34px;height:34px;font-size:22px;box-shadow:0 2px 8px rgba(42,27,20,.35)}
.qty{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--carbon);color:var(--mostaza);font-size:12px;font-weight:800;display:grid;place-items:center;border:2px solid var(--blanco)}
.ph .qty{top:6px;right:6px}
.foot{padding:30px 22px 10px;color:var(--gris);font-size:14px;line-height:1.5}
.foot b{color:var(--carbon)}
.skel{height:86px;border-radius:14px;background:linear-gradient(90deg,#fbe0da 0%,#fff3f0 50%,#fbe0da 100%);background-size:200% 100%;animation:sk 1.2s infinite;margin:0 0 10px}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- Barra del pedido ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 14px calc(12px + env(safe-area-inset-bottom));pointer-events:none}
.barbtn{pointer-events:auto;max-width:532px;margin:0 auto;width:100%;display:flex;align-items:center;gap:12px;background:var(--carbon);color:var(--blanco);border-radius:18px;padding:13px 16px;box-shadow:0 12px 30px -10px rgba(42,27,20,.7);font-weight:700;font-size:16px}
.barbtn .cnt{background:var(--mostaza);color:var(--carbon);min-width:30px;height:30px;padding:0 8px;border-radius:10px;display:grid;place-items:center;font-weight:800}
.barbtn .tot{margin-left:auto;font-weight:800}
.barbtn.bump{animation:bump .35s ease}
@keyframes bump{40%{transform:scale(1.04)}}

/* ---------- Hoja de producto ---------- */
.overlay{position:fixed;inset:0;background:rgba(42,27,20,.55);z-index:40;animation:fade .2s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:var(--blanco);border-radius:24px 24px 0 0;max-height:92vh;display:flex;flex-direction:column;animation:up .3s cubic-bezier(.2,.9,.3,1)}
.sheet .x{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;background:var(--blanco);font-size:24px;line-height:1;z-index:2;box-shadow:0 2px 10px rgba(42,27,20,.25)}
.sheet-scroll{overflow-y:auto;flex:1;overscroll-behavior:contain}
.sheet-img{width:100%;height:230px;object-fit:cover;display:block;border-radius:24px 24px 0 0}
.sheet-body{padding:22px 18px 10px}
.sheet h2{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;letter-spacing:.3px;font-size:27px;line-height:1.05;padding-right:40px}
.sheet-desc{color:var(--gris);font-size:15px;line-height:1.45;margin-top:8px}
.sheet h4{font-size:15px;font-weight:800;margin:20px 0 9px}
.vars{display:grid;gap:8px}
.var{display:flex;align-items:center;gap:12px;padding:14px;border:1.5px solid var(--linea);border-radius:14px;text-align:left;font-weight:600;font-size:16px}
.var .var-n{flex:1}
.var.on{border-color:var(--carbon);box-shadow:inset 0 0 0 1px var(--carbon);background:#FFFBF0}
.radio{width:21px;height:21px;border-radius:50%;border:2px solid var(--rosada2);flex:none;display:grid;place-items:center}
.on > .radio{border-color:var(--carbon)}
.on > .radio::after{content:"";width:11px;height:11px;border-radius:50%;background:var(--tomate)}
.sheet textarea,.f input,.f textarea,.f select{width:100%;padding:13px 14px;border:1.5px solid var(--linea);border-radius:13px;background:var(--blanco);outline:none;transition:border-color .15s,box-shadow .15s;resize:vertical}
.sheet textarea:focus,.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--carbon);box-shadow:0 0 0 3px rgba(255,194,26,.55)}
.sheet-foot{display:flex;gap:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1.5px solid var(--linea)}
.step{display:flex;align-items:center;border:1.5px solid var(--linea);border-radius:14px;flex:none}
.step button{width:44px;height:50px;font-size:24px;font-weight:700}
.step span{min-width:26px;text-align:center;font-weight:800;font-size:17px}
.cta{flex:1;display:flex;justify-content:space-between;align-items:center;background:var(--tomate);color:var(--blanco);border-radius:14px;font-weight:800;font-size:16.5px;padding:0 18px;height:52px}
.cta:active{background:var(--tomate2)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}}

/* ---------- Pedido ---------- */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--mostaza)}
.back{display:inline-flex;align-items:center;gap:4px;font-weight:700;padding:8px 12px 8px 6px;border-radius:12px;background:var(--blanco)}
.back svg{width:20px;height:20px}
.topbar h1{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;letter-spacing:.3px;font-size:21px;margin-left:auto}
.wrap{padding:18px 16px}
.ticket-w{filter:drop-shadow(0 8px 16px rgba(42,27,20,.14))}
.ticket{--s:7px;background:var(--blanco);padding:22px 18px 24px;
  -webkit-mask:radial-gradient(var(--s) at 50% 0,#0000 98%,#000) 50% 0/calc(2.4*var(--s)) 51% repeat-x,radial-gradient(var(--s) at 50% 100%,#0000 98%,#000) 50% 100%/calc(2.4*var(--s)) 51% repeat-x;
  mask:radial-gradient(var(--s) at 50% 0,#0000 98%,#000) 50% 0/calc(2.4*var(--s)) 51% repeat-x,radial-gradient(var(--s) at 50% 100%,#0000 98%,#000) 50% 100%/calc(2.4*var(--s)) 51% repeat-x}
.t-head{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:12px;border-bottom:2px dashed var(--carbon)}
.t-head b{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;letter-spacing:.3px;font-size:18px}
.t-head span{font-size:13px;color:var(--gris);font-weight:600}
.t-item{display:flex;gap:12px;padding:13px 0;border-bottom:1.5px dashed var(--linea)}
.t-main{flex:1;min-width:0}
.t-name{font-weight:700;font-size:15.5px;line-height:1.3}
.t-name span{color:var(--gris);font-weight:600}
.t-note{color:var(--gris);font-size:13.5px;margin-top:3px}
.t-right{display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.t-price{font-weight:800}
.mini{display:flex;align-items:center;border:1.5px solid var(--linea);border-radius:10px}
.mini button{width:32px;height:30px;font-weight:800;font-size:17px}
.mini span{min-width:18px;text-align:center;font-weight:800;font-size:14px}
.t-sum{padding-top:12px}
.t-row{display:flex;justify-content:space-between;padding:3px 0;font-size:15px;color:var(--carbon2)}
.t-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding-top:12px;border-top:2px dashed var(--carbon);font-weight:800;font-size:20px}
.t-total small{font-size:13px;color:var(--gris);font-weight:600}

.fsec{margin-top:26px}
.fsec h3{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;letter-spacing:.3px;font-size:19px;margin:0 2px 12px}
.f{display:block;margin-bottom:11px}
.f > span{display:block;font-size:14px;font-weight:700;color:var(--carbon2);margin-bottom:6px}
.f textarea{min-height:78px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--blanco);border:1.5px solid var(--linea);border-radius:15px;padding:4px;margin-bottom:12px}
.seg button{padding:12px;border-radius:11px;font-weight:700;font-size:15.5px}
.seg button.on{background:var(--carbon);color:var(--mostaza)}
.geo{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border:1.5px dashed var(--carbon2);border-radius:13px;font-weight:700;font-size:15px;background:transparent}
.geo svg{width:19px;height:19px}
.geo.ok{border-style:solid;border-color:var(--verde);color:var(--verde2);background:#EAF6EE}
.pays{display:grid;gap:8px}
.pay{display:flex;align-items:center;gap:12px;text-align:left;padding:14px;border:1.5px solid var(--linea);border-radius:14px;background:var(--blanco)}
.pay.on{border-color:var(--carbon);box-shadow:inset 0 0 0 1px var(--carbon)}
.pay b{display:block;font-weight:700;font-size:16px}
.pay small{display:block;color:var(--gris);font-size:14px;margin-top:2px}
.hint{font-size:14px;color:var(--gris);margin:8px 2px 0;line-height:1.4}
.err{background:#FFF1EF;border:1.5px solid #F3B8B1;color:#8E1A12;border-radius:14px;padding:12px 14px;font-size:15px;font-weight:600;margin-top:18px;line-height:1.45}
.err:empty{display:none}
.err ul{padding-left:18px}
.send{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:18px;background:var(--verde);color:var(--blanco);border-radius:17px;padding:18px;font-weight:800;font-size:17.5px;text-decoration:none;box-shadow:0 10px 22px -10px rgba(31,157,85,.8)}
.send:active{background:var(--verde2)}
.send:disabled{opacity:.65}
.send svg{width:22px;height:22px}
.fine{text-align:center;font-size:14px;color:var(--gris);margin-top:11px;line-height:1.4}
.empty-cart{text-align:center;padding:60px 20px}
.empty-cart p{color:var(--gris);margin:10px 0 20px;font-size:16px}
.btn-dark{display:inline-flex;align-items:center;justify-content:center;background:var(--carbon);color:var(--blanco);border-radius:14px;padding:14px 22px;font-weight:800;text-decoration:none}

/* ---------- Pedido enviado ---------- */
.done{padding:44px 20px 20px;text-align:center}
.okmark{width:86px;height:86px;margin:0 auto 18px;border-radius:50%;background:var(--verde);color:var(--blanco);display:grid;place-items:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.okmark svg{width:44px;height:44px}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.done h1{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;letter-spacing:.3px;font-size:32px;line-height:1.05}
.done > p{font-size:16.5px;line-height:1.5;margin:12px auto 0;max-width:32ch;color:var(--carbon2)}
.done .ticket-w{margin:24px auto 0;max-width:300px}
.done .ticket{text-align:center;padding:24px 18px}
.done .num{font-family:var(--display);font-size:34px;margin:4px 0}
.done .ticket span{color:var(--gris);font-size:14px;font-weight:600}
.done .send{max-width:360px;margin:26px auto 0}
.linkbtn{display:block;margin:16px auto 0;font-weight:700;text-decoration:underline;text-underline-offset:3px;font-size:15.5px}

.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-160%);opacity:0;visibility:hidden;z-index:90;background:var(--carbon);color:var(--blanco);padding:12px 18px;border-radius:14px;font-weight:700;font-size:15px;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);transition:transform .25s ease;max-width:calc(100% - 28px);text-align:center}
.toast{transition:transform .25s ease,opacity .25s ease,visibility .25s}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}

/* ---------- Panel ---------- */
body.is-admin{background:#FAF7F0}
.admin{max-width:1060px;margin:0 auto;padding:0 16px 70px}
.a-top{display:flex;align-items:center;gap:12px;padding:16px 0 12px;flex-wrap:wrap}
.a-brand{font-family:var(--display);font-size:24px;line-height:1}
.a-right{margin-left:auto;display:flex;gap:6px}
.openbtn{display:inline-flex;align-items:center;gap:9px;padding:10px 14px;border-radius:99px;font-weight:800;font-size:14px;background:#FFE3DF;color:var(--tomate2);border:1.5px solid #F3B8B1}
.openbtn i{width:10px;height:10px;border-radius:50%;background:var(--tomate)}
.openbtn.on{background:#E3F5EA;color:var(--verde2);border-color:#A9DDBE}
.openbtn.on i{background:var(--verde)}
.tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--linea);margin-bottom:18px;position:sticky;top:0;background:#FAF7F0;z-index:10;overflow-x:auto}
.tabs button{padding:13px 14px 11px;font-weight:800;font-size:15.5px;border-bottom:3px solid transparent;margin-bottom:-1.5px;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.tabs button.on{border-color:var(--tomate)}
.dotn{font-style:normal;background:var(--tomate);color:var(--blanco);font-size:12px;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px}
.a-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.a-tools label{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.a-tools input[type=date]{padding:9px 10px;border:1.5px solid var(--linea);border-radius:11px;background:var(--blanco)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--blanco);border-radius:16px;padding:13px 15px;border:1.5px solid var(--linea)}
.stat small{display:block;font-size:13px;color:var(--gris);font-weight:700}
.stat b{display:block;font-size:24px;font-weight:800;margin-top:3px;line-height:1.15}
.stat b.sm{font-size:15.5px;line-height:1.3;margin-top:6px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:16px 0 14px;scrollbar-width:none}
.chip{padding:8px 13px;border-radius:99px;border:1.5px solid var(--linea);background:var(--blanco);font-weight:700;font-size:14px;white-space:nowrap}
.chip.on{background:var(--carbon);color:var(--blanco);border-color:var(--carbon)}
.chip span{opacity:.6;margin-left:3px}
.orders{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;align-items:start}
.ocard{background:var(--blanco);border-radius:16px;padding:15px;border:1.5px solid var(--linea);border-top:5px solid var(--c)}
.ocard.st-nuevo{box-shadow:0 0 0 3px rgba(212,42,31,.14)}
.o-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.o-head b{font-size:17px;font-weight:800}
.o-head .hora{color:var(--gris);font-weight:600;font-size:14px;margin-left:6px}
.badge{font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:99px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,white)}
.o-cli{margin-top:10px;font-size:15px}
.o-cli a{font-weight:700}
.o-dir{font-size:14.5px;color:var(--carbon2);margin-top:3px;line-height:1.4}
.o-dir a{font-weight:700;color:var(--tomate2)}
.o-items{list-style:none;margin:11px 0 0;padding:10px 0 0;border-top:1.5px dashed var(--linea)}
.o-items li{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;padding:3px 0}
.o-items em{display:block;font-style:normal;color:var(--gris);font-size:13.5px}
.o-obs{margin-top:8px;background:#FFF8E5;border-radius:10px;padding:8px 10px;font-size:14px}
.o-tot{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:10px;padding-top:10px;border-top:1.5px dashed var(--linea);font-size:14px;color:var(--carbon2)}
.o-tot b{font-size:19px;color:var(--carbon)}
.o-act{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:12px;font-weight:700;font-size:14.5px;border:1.5px solid var(--linea);background:var(--blanco);text-decoration:none;color:var(--carbon);cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--carbon);color:var(--blanco);border-color:var(--carbon)}

async function initFirebase(withAuth){

function compressImage(file, max = 720, q = .72){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const r = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width * r); cv.height = Math.round(img.height * r);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
      let out = cv.toDataURL('image/jpeg', q); if (out.length > 400000) out = cv.toDataURL('image/jpeg', .55);
      res(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}

      const ins = A.insumos.find(x => x.id === r.i); if (!ins) return;
      cu += (+r.c || 0) * (+ins.costo || 0);
      consumo[r.i] = (consumo[r.i] || 0) + (+r.c || 0) * it.cant;
    });
    costo += cu * it.cant;
    return {...it, costo: Math.round(cu), conReceta: !!(rec && rec.length)};
  });
  return {items: its, costo: Math.round(costo), consumo};
}
async function registrarVenta(v, id){
  const {doc, collection, writeBatch, increment} = fb.fs;
  const c = costear(v.items), b = writeBatch(fb.db);
  const ref = id ? doc(fb.db, 'ventas', id) : doc(collection(fb.db, 'ventas'));
  b.set(ref, {...v, estado: 'aprobada', items: c.items, costo: c.costo, consumo: c.consumo});
  Object.entries(c.consumo).forEach(([iid, q]) => b.update(doc(fb.db, 'insumos', iid), {stock: increment(-q)}));
  await b.commit();
}

async function ventaDesdePedido(p){

  };

// Aprobar: la venta cuenta en los reportes y descuenta el inventario según la receta. El pedido queda entregado.
async function aprobarVenta(id){
  const {doc, runTransaction, increment, serverTimestamp} = fb.fs, vref = doc(fb.db, 'ventas', id);
  return runTransaction(fb.db, async tx => {
    const s = await tx.get(vref); if (!s.exists()) return false;
    const v = s.data(); if (!esPend(v)) return false;
    const c = costear(v.items || []);
    tx.update(vref, {estado: 'aprobada', aprobadaEn: serverTimestamp(), items: c.items, costo: c.costo, consumo: c.consumo});
    Object.entries(c.consumo).forEach(([iid, q]) => { if (A.insumos.some(x => x.id === iid)) tx.update(doc(fb.db, 'insumos', iid), {stock: increment(-q)}); });
    if (v.pedidoId) tx.update(doc(fb.db, 'pedidos', v.pedidoId), {estado: 'entregado', t_entregado: serverTimestamp()});
    return true;
  });
}
// Si se cancela un pedido que ya estaba en ventas, se quita de las ventas y los insumos vuelven al inventario.
async function quitarVentaDePedido(pid){
  const {doc, runTransaction, increment} = fb.fs, vref = doc(fb.db, 'ventas', 'p_' + pid);
  return runTransaction(fb.db, async tx => {
    const s = await tx.get(vref); if (!s.exists()) return false;
    if (!esPend(s.data())) Object.entries(s.data().consumo || {}).forEach(([iid, q]) => { if (A.insumos.some(x => x.id === iid)) tx.update(doc(fb.db, 'insumos', iid), {stock: increment(q)}); });
    tx.delete(vref);
    return true;
  });
}

async function saveCompra(){
  const m = A.modal;
  const filas = m.items.map(i => ({...i, nombre: i.nombre.trim(), c: parseNum(i.cant), t: parseMoney(i.total)})).filter(i => i.nombre || i.c || i.t);
  if (!filas.length) return toast('Agrega al menos un insumo');
  if (filas.some(i => !i.nombre || !(i.c > 0) || !(i.t > 0))) return toast('Cada fila necesita insumo, cantidad y valor');
  const g = {};
  filas.forEach(i => {
    const ins = A.insumos.find(x => x.id === i.insumoId) || A.insumos.find(x => slug(x.nombre) === slug(i.nombre));
    const k = ins ? ins.id : 'nuevo:' + slug(i.nombre);
    g[k] = g[k] || {insumoId: ins?.id || '', nombre: ins?.nombre || i.nombre, unidad: ins?.unidad || i.unidad, cant: 0, total: 0};
    g[k].cant += i.c; g[k].total += i.t;
  });
  const items = Object.values(g), total = items.reduce((a, i) => a + i.total, 0);
  const {runTransaction, doc, collection, Timestamp} = fb.fs, b = $('#c-save');
  b.disabled = true; b.textContent = 'Guardando…';
  const r2 = n => Math.round(n * 100) / 100;
  try {
    await runTransaction(fb.db, async tx => {
      const refs = items.map(i => i.insumoId ? doc(fb.db, 'insumos', i.insumoId) : doc(collection(fb.db, 'insumos')));
      const snaps = [];
      for (let k = 0; k < items.length; k++) snaps.push(items[k].insumoId ? await tx.get(refs[k]) : null);
      items.forEach((i, k) => {
        const s = snaps[k], cur = s && s.exists() ? s.data() : null, unit = i.total / i.cant;
        if (cur){
          const st = Math.max(0, +cur.stock || 0);
          tx.update(refs[k], {stock: (+cur.stock || 0) + i.cant, costo: r2((st * (+cur.costo || 0) + i.total) / (st + i.cant)), ultimoCosto: r2(unit)});
        } else tx.set(refs[k], {nombre: i.nombre, unidad: i.unidad, cat: 'Otros', minimo: 0, stock: i.cant, costo: r2(unit), ultimoCosto: r2(unit)});
        i.insumoId = refs[k].id;
      });
      tx.set(doc(collection(fb.db, 'compras')), {fecha: Timestamp.fromDate(fechaDe(m.fecha)), proveedor: m.proveedor.trim(), pago: m.pago, nota: m.nota.trim(), items: items.map(i => ({insumoId: i.insumoId, nombre: i.nombre, unidad: i.unidad, cant: i.cant, total: i.total})), total});
    });
    closeModal(); toast('Compra guardada y sumada al inventario');
  } catch (e){ b.disabled = false; compraRowInfo(0); toast('No se pudo guardar: ' + (e.code || e.message)); }
}

function rangoReporte(){
  const r = A.rep, hoy = isoHoy();
  if (r.periodo === 'hoy') return rangoJornada(hoy);
  if (r.periodo === 'semana'){ const [y, m, d] = hoy.split('-').map(Number); const dow = (new Date(y, m - 1, d, 12).getDay() + 6) % 7; return [new Date(y, m - 1, d - dow, CORTE), new Date(y, m - 1, d - dow + 7, CORTE)]; }
  if (r.periodo === 'mes') return rangoMes(mesActual());
  if (r.periodo === 'mespasado'){ const [y, m] = mesActual().split('-').map(Number); const d = new Date(y, m - 2, 1); return rangoMes(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`); }
  const a = r.desde || hoy, b = r.hasta || hoy;
  return a <= b ? [rangoJornada(a)[0], rangoJornada(b)[1]] : [rangoJornada(b)[0], rangoJornada(a)[1]];
}
let repToken = 0;
async function cargarReporte(){
  const t = ++repToken, [a, b] = rangoReporte();
  A.rep.loading = true; if (A.tab === 'reportes') renderAdminBody();
  const {collection, query, where, getDocs, Timestamp} = fb.fs;
  const q = col => getDocs(query(collection(fb.db, col), where('fecha', '>=', Timestamp.fromDate(a)), where('fecha', '<', Timestamp.fromDate(b))));
  try {
    const [v, c, g, aj] = await Promise.all(['ventas', 'compras', 'gastos', 'ajustes'].map(q));
    if (t !== repToken) return;
    const rows = s => s.docs.map(d => ({id: d.id, ...d.data()}));
    A.rep.data = {a, b, ventas: rows(v), compras: rows(c), gastos: rows(g), ajustes: rows(aj)};
  } catch (e){ toast('No se pudo calcular: ' + e.code); A.rep.data = null; }
  A.rep.loading = false; if (A.tab === 'reportes') renderAdminBody();
}
function calcReporte(d0){
  const d = {...d0, ventas: aprobadas(d0.ventas)};
  const S_ = (arr, f) => arr.reduce((a, x) => a + (+f(x) || 0), 0);
  const ventas = S_(d.ventas, v => v.total), costo = S_(d.ventas, v => v.costo), dom = S_(d.ventas, v => v.domicilio);
  const compras = S_(d.compras, c => c.total), gastos = S_(d.gastos, g => g.valor);
  const mermas = -S_(d.ajustes.filter(x => (+x.dif || 0) < 0), x => x.valor);
  let conRec = 0, itemsVal = 0; const prod = {};
  d.ventas.forEach(v => (v.items || []).forEach(i => {
    const val = (+i.precio || 0) * (+i.cant || 0); itemsVal += val; if (i.conReceta) conRec += val;
    const k = i.nombre + (i.variante ? ' ' + i.variante.toLowerCase() : '');
    const p = prod[k] = prod[k] || {n: k, cant: 0, val: 0, costo: 0, rec: true};
    p.cant += +i.cant || 0; p.val += val; p.costo += (+i.costo || 0) * (+i.cant || 0); if (!i.conReceta) p.rec = false;
  }));
  const dias = [];
  for (let t = new Date(d.a); t < d.b && dias.length < 63; t = new Date(t.getFullYear(), t.getMonth(), t.getDate() + 1, CORTE)) dias.push({k: jornadaStr(t), t: new Date(t), v: 0});
  d.ventas.forEach(v => { const k = jornadaStr(dOf(v.fecha)); const x = dias.find(y => y.k === k); if (x) x.v += +v.total || 0; });
  const medios = {};
  const addM = (k, campo, n) => { k = k || 'Sin dato'; medios[k] = medios[k] || {entro: 0, salio: 0}; medios[k][campo] += +n || 0; };
  d.ventas.forEach(v => addM(v.pago, 'entro', v.total)); d.compras.forEach(c => addM(c.pago, 'salio', c.total)); d.gastos.forEach(g => addM(g.pago, 'salio', g.valor));
  return {
    ventas, costo, dom, compras, gastos, mermas, n: d.ventas.length,
    bruta: ventas - costo, neta: ventas - costo - gastos - mermas, caja: ventas - compras - gastos,
    cobertura: itemsVal ? conRec / itemsVal : 0,
    prod: Object.values(prod).sort((a, b) => b.val - a.val), dias,
    canal: porClave(d.ventas, v => v.canal, v => v.total), gcat: porClave(d.gastos, g => g.categoria, g => g.valor),
    medios: Object.entries(medios).sort((a, b) => (b[1].entro + b[1].salio) - (a[1].entro + a[1].salio))
  };
}
function niceMax(v){ if (v <= 0) return 1; const e = Math.pow(10, Math.floor(Math.log10(v))), f = v / e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e; }
function chartDias(dias){
  const max = niceMax(Math.max(...dias.map(x => x.v))), n = dias.length;
  const best = dias.reduce((a, x) => x.v > a.v ? x : a, dias[0]);
  const step = n > 16 ? 5 : n > 8 ? 2 : 1;
  const lab = x => n <= 7 ? x.t.toLocaleDateString('es-CO', {weekday: 'short'}) : String(x.t.getDate());
  return `<div class="vc">
    <div class="vc-plot">
      ${[0.5, 1].map(f => `<div class="vc-g" style="bottom:${f * 100}%"><span>${fmtK(max * f)}</span></div>`).join('')}
      ${dias.map(x => `<button class="vc-b" data-tip="${esc(fdia(x.t))}: ${fmt(x.v)}" aria-label="${esc(fdia(x.t))}: ${fmt(x.v)}">${x === best && x.v ? `<em>${fmtK(x.v)}</em>` : ''}<i style="height:${x.v ? Math.max(1.5, x.v / max * 100) : 0}%"></i></button>`).join('')}
    </div>
    <div class="vc-x">${dias.map((x, i) => `<span>${i % step === 0 ? esc(lab(x)) : ''}</span>`).join('')}</div>
  </div>`;
}

      <section class="card"><h3>Lo más vendido</h3>${k.prod.length ? `<table class="mtab"><thead><tr><th>Producto</th><th>Cant.</th><th>Vendido</th><th>Margen</th></tr></thead><tbody>${k.prod.slice(0, 12).map(p => `<tr><td>${esc(p.n)}</td><td>${fmtCant(p.cant)}</td><td>${fmt(p.val)}</td><td>${p.rec ? pct(p.val - p.costo, p.val) : '<span class="muted">Sin receta</span>'}</td></tr>`).join('')}</tbody></table>` : '<p class="help">Sin ventas en estas fechas.</p>'}</section>
      <section class="card"><h3>Ventas por canal</h3>${k.canal.length ? barsH(k.canal) : '<p class="help">Sin ventas en estas fechas.</p>'}
        <h3 style="margin-top:22px">Gastos por categoría</h3>${k.gcat.length ? barsH(k.gcat) : '<p class="help">Sin gastos en estas fechas.</p>'}</section>
    </div>
    <div class="a-tools" style="margin-top:16px"><button class="btn" data-act="r-csv">Descargar para Excel</button></div>`;
}
function exportCSV(){
  const d0 = A.rep.data; if (!d0) return;
  const d = {...d0, ventas: aprobadas(d0.ventas)};
  const rows = [['Tipo', 'Fecha', 'Hora', 'Detalle', 'Canal / proveedor / categoría', 'Medio de pago', 'Valor', 'Costo']];
  const fh = x => { const f = dOf(x.fecha); return [f.toLocaleDateString('es-CO'), hhmm(f)]; };
  d.ventas.forEach(v => rows.push(['Venta', ...fh(v), (v.items || []).map(i => `${i.cant} ${i.nombre}${i.variante ? ' ' + i.variante : ''}`).join(' + '), v.canal, v.pago, v.total, v.costo || 0]));
  d.compras.forEach(c => rows.push(['Compra', ...fh(c), (c.items || []).map(i => `${i.cant} ${i.unidad} ${i.nombre}`).join(' + '), c.proveedor, c.pago, c.total, '']));
  d.gastos.forEach(g => rows.push(['Gasto', ...fh(g), g.descripcion, g.categoria, g.pago, g.valor, '']));
  d.ajustes.forEach(a => rows.push(['Ajuste de inventario', ...fh(a), `${a.nombre}: ${a.antes} → ${a.despues} ${a.unidad}`, a.motivo, '', a.valor, '']));
  const csv = '﻿' + rows.map(r => r.map(c => `"${String(c ?? '').replace(/"/g, '""')}"`).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv;charset=utf-8'}));
  a.download = `codigo121_${jornadaStr(d.a)}_a_${jornadaStr(new Date(d.b - 1))}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
}

const tipEl = document.createElement('div'); tipEl.className = 'tip'; tipEl.setAttribute('role', 'tooltip'); document.body.appendChild(tipEl);
function showTip(el){
  tipEl.textContent = el.dataset.tip; tipEl.style.display = 'block';
  const r = el.getBoundingClientRect(), tw = tipEl.offsetWidth;
  tipEl.style.left = Math.min(innerWidth - tw - 8, Math.max(8, r.left + r.width / 2 - tw / 2)) + 'px';
  tipEl.style.top = (r.top + scrollY - tipEl.offsetHeight - 8) + 'px';
}
document.addEventListener('pointerover', e => { const t = e.target.closest?.('[data-tip]'); if (t) showTip(t); });
document.addEventListener('pointerout', e => { if (e.target.closest?.('[data-tip]')) tipEl.style.display = 'none'; });
document.addEventListener('focusin', e => { const t = e.target.closest?.('[data-tip]'); if (t) showTip(t); });
document.addEventListener('focusout', e => { if (e.target.closest?.('[data-tip]')) tipEl.style.display = 'none'; });

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  switch (act){
    // panel
    case 'a-tab': A.tab = el.dataset.v; updateTabBadge(); if (A.tab === 'reportes') cargarReporte(); else renderAdminBody(); window.scrollTo(0, 0); break;
    case 'a-filtro': A.filtro = el.dataset.v; renderAdminBody(); break;
    case 'a-hoy': A.fecha = jornadaStr(new Date()); subPedidos(); subVentas(); renderAdminBody(); break;
    case 'a-estado': el.disabled = true; await setEstado(id, el.dataset.v); break;
    case 'a-cancel': if (confirm('¿Cancelar este pedido? Se quita de las ventas y los insumos vuelven al inventario.')) await setEstado(id, 'cancelado'); break;
    case 'a-toggle': {
      const {doc, setDoc} = fb.fs, nuevo = !A.cfg.abierto;
      if (!nuevo && !confirm('¿Cerrar? Los clientes no podrán enviar pedidos hasta que vuelvas a abrir.')) break;
      try { await setDoc(doc(fb.db, 'config', 'negocio'), {abierto: nuevo}, {merge: true}); toast(nuevo ? 'Abierto: ya recibes pedidos' : 'Cerrado: no se reciben pedidos'); }
      catch (x){ toast('No se pudo cambiar: ' + x.code); }
      break;
    }
    case 'a-logout': fb.au.signOut(fb.auth); break;
    case 'a-notif': try { await Notification.requestPermission(); } catch (x){} renderAdminBody(); break;
    case 'a-new': openEdit(null); break;
    case 'a-edit': openEdit(id); break;
    case 'a-seed': await seedMenu(); break;
    case 'e-close': case 'm-close': closeModal(); break;
    case 'e-addrec': { readEdit(); const k = el.dataset.v; (A.edit.rec[k] = A.edit.rec[k] || []).push({i: '', c: 0}); $('#e-rec').innerHTML = recetaHTML(A.edit.p); break; }
    case 'e-delrec': { readEdit(); const k = el.dataset.v; (A.edit.rec[k] || []).splice(+el.dataset.j, 1); $('#e-rec').innerHTML = recetaHTML(A.edit.p); break; }
    // ventas
    case 'v-new': openVenta(); break;
    case 'v-add': {
      const p = menuVenta().find(x => x.id === id); if (!p) break;
      const i = +el.dataset.i, v = i >= 0 ? p.variantes[i] : null, variante = v ? v.n : '';
      const ex = A.modal.items.find(x => x.id === p.id && x.variante === variante);
      if (ex) ex.cant++; else A.modal.items.push({id: p.id, nombre: p.nombre, variante, precio: v ? +v.p : +p.precio, cant: 1});
      renderVentaSel(); break;
    }
    case 'v-inc': case 'v-dec': { const k = +el.dataset.i, it = A.modal.items[k]; if (!it) break; it.cant += act === 'v-inc' ? 1 : -1; if (it.cant <= 0) A.modal.items.splice(k, 1); renderVentaSel(); break; }
    case 'v-canal': A.modal.canal = el.dataset.v; pillsOn(el); break;
    case 'v-pago': case 'c-pago': case 'g-pago': A.modal.pago = el.dataset.v; pillsOn(el); break;
    case 'v-save': saveVenta(); break;
    case 'v-del': anularVenta(id); break;
    case 'v-ok': aprobarDesdeVentas(id, el); break;
    // inventario
    case 'i-seed': el.disabled = true; await seedInsumos(); break;
    case 'i-new': openInsumo(null); break;
    case 'i-edit': openInsumo(id); break;
    case 'i-save': saveInsumo(); break;
    case 'i-del': delInsumo(); break;
    case 'i-adj': openAjuste(id); break;
    case 'aj-mot': A.modal.motivo = el.dataset.v; pillsOn(el); break;
    case 'aj-save': saveAjuste(); break;
    // compras y gastos
    case 'c-new': openCompra(); break;
    case 'c-addrow': A.modal.items.push(nuevaFila()); renderCompra(false); { const ins = $$('.c-n'); ins[ins.length - 1]?.focus(); } break;
    case 'c-delrow': A.modal.items.splice(+el.dataset.i, 1); if (!A.modal.items.length) A.modal.items.push(nuevaFila()); renderCompra(false); break;
    case 'c-save': saveCompra(); break;
    case 'c-del': anularCompra(id); break;
    case 'g-new': openGasto(); break;
    case 'g-save': saveGasto(); break;
    case 'g-del': borrarGasto(id); break;
    // reportes
    case 'r-per': {
      A.rep.periodo = el.dataset.v;
      if (A.rep.periodo === 'rango'){ if (!A.rep.desde){ const [a] = rangoMes(mesActual()); A.rep.desde = jornadaStr(new Date(a.getTime() + 36e5 * 8)); A.rep.hasta = isoHoy(); } cargarReporte(); }
      else cargarReporte();
      break;
    }
    case 'r-go': A.rep.desde = $('#r-desde').value || isoHoy(); A.rep.hasta = $('#r-hasta').value || A.rep.desde; cargarReporte(); break;
    case 'r-csv': exportCSV(); break;
    case 'e-save': saveEdit(); break;
    case 'e-nofoto': readEdit(); A.edit.p.foto = ''; $('#e-fotourl').value = ''; renderEdit(); break;
    case 'e-addvar': readEdit(); A.edit.p.variantes.push({n: '', p: 0}); renderEdit(); break;
    case 'e-delvar': readEdit(); A.edit.p.variantes.splice(+el.dataset.i, 1); if (!A.edit.p.variantes.length) A.edit.p.precio = A.edit.p.precio || 0; renderEdit(); break;
    case 'e-del': {
      if (!confirm('¿Eliminar este producto del menú?')) break;
      const {doc, deleteDoc} = fb.fs;
      try { const pid = A.edit.id; await deleteDoc(doc(fb.db, 'productos', pid)); if (A.recetas[pid]) await deleteDoc(doc(fb.db, 'recetas', pid)); closeModal(); toast('Producto eliminado'); } catch (x){ toast('No se pudo eliminar: ' + x.code); }
      break;
    }
    case 'a-savecfg': saveCfg(); break;
    case 'a-cmbtest': {
      const key = ($('#c-cmbKey')?.value || '').trim(), tel = waNum(($('#c-whatsapp')?.value || A.cfg.whatsapp));
      if (!key) { toast('Primero pega tu APIKEY de CallMeBot'); break; }
      const txt = `✅ Prueba de ${A.cfg.nombre || DEFAULT_CONFIG.nombre}: así te van a llegar los pedidos nuevos.`;
      try { await fetch(`https://api.callmebot.com/whatsapp.php?phone=%2B${tel}&apikey=${encodeURIComponent(key)}&text=${encodeURIComponent(txt)}`, {mode: 'no-cors'}); } catch (x){}
      toast('Enviado. Revisa tu WhatsApp; si no llega en un minuto, revisa la APIKEY.');
      break;
    }
    case 'a-copy': { const v = $('#c-link').value; try { await navigator.clipboard.writeText(v); toast('Link copiado'); } catch (x){ $('#c-link').select(); document.execCommand('copy'); toast('Link copiado'); } break; }
  }
});

    const old = t.dataset.old || '', nv = t.value.trim();

  if (act === 'a-disp'){
    const {doc, updateDoc} = fb.fs;
    try { await updateDoc(doc(fb.db, 'productos', t.dataset.id), {disponible: t.checked}); toast(t.checked ? 'Disponible otra vez' : 'Marcado como agotado'); }
    catch (x){ t.checked = !t.checked; toast('No se pudo cambiar: ' + x.code); }
  }
  if (act === 'e-hasvar'){
    readEdit(); const p = A.edit.p;
    const prev = (p.variantes || []).filter(v => v.p > 0);
    if (t.checked) p.variantes = [{n: 'Personal', p: p.precio || 0}, {n: 'Familiar', p: 0}];
    else { p.precio = prev.length ? Math.min(...prev.map(v => v.p)) : (p.precio || 0); p.variantes = []; }
    renderEdit();
  }
  if (act === 'e-file' && t.files?.[0]){
    readEdit();
    try { A.edit.p.foto = await compressImage(t.files[0]); $('#e-fotourl') && ($('#e-fotourl').value = ''); renderEdit(); }
    catch (x){ toast('No se pudo leer esa imagen'); }
  }
});
